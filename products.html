<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>আমাদের পণ্য - শপিং স্মার্ট দর্শনা</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5faf6;
      color: #222;
    }

    header {
      background: #087f3f;
      color: white;
      padding: 18px 15px;
      text-align: center;
    }

    header h1 { margin: 0; font-size: 28px; }
    header p { margin: 6px 0 0; font-size: 14px; }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 25px 15px;
    }

    .title {
      text-align: center;
      margin-bottom: 20px;
    }

    .title h2 {
      margin: 0 0 8px;
      color: #087f3f;
    }

    .title p {
      margin: 0;
      color: #555;
    }

    .search-box {
      max-width: 650px;
      margin: 0 auto 18px;
    }

    .search-box input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #ccc;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    .search-box input:focus { border-color: #087f3f; }

    .categories {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
      margin-bottom: 20px;
    }

    .categories button,
    .page-btn {
      border: none;
      background: #087f3f;
      color: white;
      padding: 10px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 15px;
    }

    .categories button.active,
    .categories button:hover,
    .page-btn:hover {
      background: #056631;
    }

    .result-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 10px 0 18px;
      color: #555;
      font-size: 14px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product {
      background: white;
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      box-shadow: 0 5px 18px #00000012;
      border: 1px solid #dff1e4;
    }

    .product-image {
      width: 100%;
      height: 190px;
      object-fit: contain;
      border-radius: 12px;
      background: #f7f7f7;
      margin-bottom: 12px;
    }

    .emoji-image {
      width: 100%;
      height: 190px;
      border-radius: 12px;
      background: #f7f7f7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 70px;
      margin-bottom: 12px;
    }

    .product h3 {
      margin: 8px 0;
      color: #087f3f;
      font-size: 19px;
    }

    .product p {
      margin: 7px 0;
      color: #555;
      line-height: 1.5;
      min-height: 44px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      color: #e65100;
      margin: 12px 0;
    }

    .order-btn {
      border: none;
      background: #f6c400;
      color: #222;
      padding: 11px 20px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .order-btn:hover { background: #e5b700; }

    #empty {
      display: none;
      text-align: center;
      padding: 30px;
      color: #777;
      font-size: 18px;
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 28px 0 10px;
    }

    .page-number {
      min-width: 42px;
      border-radius: 10px;
    }

    .page-info {
      font-weight: bold;
      color: #087f3f;
      padding: 8px 10px;
    }

    .back-home {
      display: block;
      width: fit-content;
      margin: 30px auto 0;
      text-decoration: none;
      background: #087f3f;
      color: white;
      padding: 11px 20px;
      border-radius: 10px;
    }

    .back-home:hover { background: #056631; }

    @media (max-width: 600px) {
      header h1 { font-size: 23px; }

      .container { padding: 20px 12px; }

      .products { grid-template-columns: 1fr; }

      .product-image,
      .emoji-image { height: 220px; }
    }
  </style>
</head>

<body>

  <header>
    <h1>শপিং স্মার্ট দর্শনা</h1>
    <p>আপনার পছন্দের পণ্য এক জায়গায়</p>
  </header>

  <div class="container">

    <div class="title">
      <h2>আমাদের পণ্য</h2>
      <p>পছন্দের পণ্য খুঁজে অর্ডার করুন</p>
    </div>

    <div class="search-box">
      <input
        type="text"
        id="search"
        placeholder="পণ্যের নাম লিখে খুঁজুন..."
        oninput="searchProducts()"
      >
    </div>

    <div class="categories" id="categoryButtons">
      <button class="active" onclick="setCategory('all', this)">সব পণ্য</button>
      <button onclick="setCategory('fashion', this)">ফ্যাশন</button>
      <button onclick="setCategory('electronics', this)">ইলেকট্রনিক্স</button>
      <button onclick="setCategory('home', this)">ঘর ও গৃহস্থালি</button>
      <button onclick="setCategory('beauty', this)">বিউটি</button>
    </div>

    <div class="result-bar">
      <span id="resultCount">পণ্য: 0</span>
      <span>Fashion — স্টাইলিশ ও আকর্ষণীয় ফ্যাশন পণ্য যা আপনার মনের মত পণ্য হবে ❤️‍🩹💯 </span>
    </div>

    <div class="products" id="products"></div>

    <div id="empty">
      কোনো পণ্য পাওয়া যায়নি।
    </div>

    <div class="pagination" id="pagination"></div>

    <a href="index.html" class="back-home">🏠 হোম পেজে ফিরে যান</a>
  </div>

  <script>
    /*
    =========================================================
    নতুন পণ্য যোগ করার একমাত্র জায়গা: নিচের PRODUCTS তালিকা।

    এখানে ১০,০০০-এর বেশি পণ্যও যোগ করা যাবে।
    প্রতিটি নতুন পণ্যের জন্য শুধু একটি নতুন {...} যোগ করুন।
    JavaScript-এর অন্য কোনো অংশ পরিবর্তন করবেন না।

    গুরুত্বপূর্ণ:
    ১০,০০০+ পণ্য হলে একসাথে সবগুলো স্ক্রিনে দেখানো হবে না।
    প্রতি পেজে ২৪টি করে দেখাবে এবং পরের/আগের বাটন থাকবে।
    এতে বড় পণ্য তালিকাও ব্যবহার করা সহজ থাকবে।

    category অবশ্যই:
    fashion / electronics / home / beauty

    image:
    ছবি না থাকলে image: "" রেখে emoji ব্যবহার করতে পারেন।
    =========================================================
    */

    const PRODUCTS = [
      
{
  name: "পাকিস্তানি থ্রি পিস",
  id: "threepiece1",
  category: "fashion",
  price: 1500,
  image: "threepiece1.png",
  emoji: "👗",
  description: "👗 পাকিস্তানি থ্রি পিস | কাপড়: লন/কটন | কাজ: সুন্দর এমব্রয়ডারি | সেটে আছে: লং কামিজ, প্যান্ট ও ওড়না | সাইজ: M, L, XL | স্টাইলিশ ও আকর্ষণীয় ডিজাইন।",
},
      =========================================================
      উদাহরণ: নতুন থ্রি পিস যোগ করতে নিচের মতো লিখবেন।

      ,
      {
        name: "থ্রি পিস",
        category: "fashion",
        price: 1200,
        image: "threepiece.png",
        emoji: "👗",
        description: "সুন্দর ডিজাইনের থ্রি পিস।"
      }

      শুধু এই তথ্যগুলো বদলাবেন:
      name     = পণ্যের নাম
      category = fashion/electronics/home/beauty
      price    = দাম
      image    = GitHub-এ আপলোড করা ছবির নাম
      description = পণ্যের বিবরণ

      নতুন পণ্য যোগ করার সময় আগের পণ্যের শেষ } এর পরে
      একটি কমা (,) দিতে হবে।
      =========================================================
      */
    ];

    const DELIVERY_CHARGE = 120;
    const WHATSAPP_NUMBER = "8801981000610";
    const PRODUCTS_PER_PAGE = 24;

    let selectedCategory = "all";
    let currentPage = 1;

    function formatPrice(number) {
      return Number(number).toLocaleString("bn-BD");
    }

    function createProductCard(product) {
      const card = document.createElement("div");
      card.className = "product";

      let visual = "";

      if (product.image) {
        visual = `
          <img
            src="${escapeHtml(product.image)}"
            alt="${escapeHtml(product.name)}"
            class="product-image"
            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
          >
          <div class="emoji-image" style="display:none;">
            ${product.emoji || "🛍️"}
          </div>
        `;
      } else {
        visual = `
          <div class="emoji-image">
            ${product.emoji || "🛍️"}
          </div>
        `;
      }

      card.innerHTML = `
        ${visual}

        <h3>${escapeHtml(product.name)}</h3>

        <p>${escapeHtml(product.description || "")}</p>

        <div class="price">
          ৳ ${formatPrice(product.price)}
        </div>

        <button class="order-btn" type="button">
          🛒 অর্ডার করুন
        </button>
      `;

      card.querySelector(".order-btn").addEventListener("click", function() {
        order(product);
      });

      return card;
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getFilteredProducts() {
  const search = document
    .getElementById("search")
    .value
    .toLowerCase()
    .trim();

  const productId = new URLSearchParams(window.location.search)
    .get("product");

  return PRODUCTS.filter(function(product) {
    const productMatch =
      !productId || product.id === productId;

    const categoryMatch =
      selectedCategory === "all" ||
      product.category === selectedCategory;

    const text =
      (product.name + " " + (product.description || ""))
      .toLowerCase();

    const searchMatch =
      !search || text.includes(search);

    return productMatch && categoryMatch && searchMatch;
  });
}

    function renderProducts() {
      const list = getFilteredProducts();
      const container = document.getElementById("products");
      const empty = document.getElementById("empty");
      const pagination = document.getElementById("pagination");

      container.innerHTML = "";
      pagination.innerHTML = "";

      document.getElementById("resultCount").textContent =
        "পণ্য: " + formatPrice(list.length);

      if (list.length === 0) {
        empty.style.display = "block";
        return;
      }

      empty.style.display = "none";

      const totalPages =
        Math.ceil(list.length / PRODUCTS_PER_PAGE);

      if (currentPage > totalPages) {
        currentPage = totalPages;
      }

      const start =
        (currentPage - 1) * PRODUCTS_PER_PAGE;

      const pageProducts =
        list.slice(start, start + PRODUCTS_PER_PAGE);

      pageProducts.forEach(function(product) {
        container.appendChild(createProductCard(product));
      });

      renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
      const pagination =
        document.getElementById("pagination");

      if (totalPages <= 1) return;

      const previous = document.createElement("button");
      previous.className = "page-btn";
      previous.textContent = "‹ আগের";
      previous.disabled = currentPage === 1;
      previous.onclick = function() {
        if (currentPage > 1) {
          currentPage--;
          renderProducts();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      };
      pagination.appendChild(previous);

      const info = document.createElement("span");
      info.className = "page-info";
      info.textContent =
        currentPage + " / " + totalPages;
      pagination.appendChild(info);

      const next = document.createElement("button");
      next.className = "page-btn";
      next.textContent = "পরের ›";
      next.disabled = currentPage === totalPages;
      next.onclick = function() {
        if (currentPage < totalPages) {
          currentPage++;
          renderProducts();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      };
      pagination.appendChild(next);
    }

    function setCategory(category, button) {
      selectedCategory = category;
      currentPage = 1;

      document
        .querySelectorAll("#categoryButtons button")
        .forEach(function(btn) {
          btn.classList.remove("active");
        });

      button.classList.add("active");

      renderProducts();
    }

    function searchProducts() {
      currentPage = 1;
      renderProducts();
    }

    function order(product) {
  const productPrice = Number(product.price);

  if (!product.name || !productPrice || productPrice <= 0) {
    alert("পণ্যের তথ্য সঠিক নয়।");
    return;
  }

  const oldModal = document.getElementById("orderModal");
  if (oldModal) oldModal.remove();

  const imageUrl = product.image
    ? new URL(product.image, window.location.href).href
    : "";

  const modal = document.createElement("div");
  modal.id = "orderModal";

  modal.innerHTML = `
    <div style="
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.65);
      z-index:9999;
      overflow:auto;
      padding:20px;
    ">
      <div style="
        max-width:500px;
        margin:20px auto;
        background:white;
        border-radius:18px;
        padding:20px;
      ">

        <button id="closeOrder" style="
          float:right;
          border:none;
          background:#eee;
          width:38px;
          height:38px;
          border-radius:50%;
          font-size:24px;
        ">×</button>

        <h2 style="
          color:#087f3f;
          text-align:center;
        ">🛒 পণ্য অর্ডার ফর্ম</h2>

        ${
          imageUrl
            ? `<img src="${escapeHtml(imageUrl)}"
                style="
                  width:100%;
                  max-height:280px;
                  object-fit:contain;
                  border-radius:14px;
                  background:#f7f7f7;
                  margin:10px 0;
                "
                alt="${escapeHtml(product.name)}">`
            : ""
        }

        <h2 style="
          color:#087f3f;
          text-align:center;
        ">${escapeHtml(product.name)}</h2>

        <p style="text-align:center;color:#555;">
          ${escapeHtml(product.description || "")}
        </p>

        <div style="
          text-align:center;
          font-size:24px;
          font-weight:bold;
          color:#e65100;
          margin:15px;
        ">
          ৳ ${formatPrice(productPrice)}
        </div>

        <input id="orderName"
          placeholder="আপনার নাম লিখুন"
          style="width:100%;padding:14px;margin:6px 0;
          border:1px solid #ccc;border-radius:10px;font-size:16px;">

        <input id="orderPhone"
          type="tel"
          placeholder="আপনার মোবাইল নম্বর লিখুন"
          style="width:100%;padding:14px;margin:6px 0;
          border:1px solid #ccc;border-radius:10px;font-size:16px;">

        <input id="orderQuantity"
          type="number"
          min="1"
          placeholder="পণ্য সংখ্যা কয়টি লিখুন"
          style="width:100%;padding:14px;margin:6px 0;
          border:1px solid #ccc;border-radius:10px;font-size:16px;">

        <input id="orderDistrict"
  placeholder="জেলা লিখুন"
  style="width:100%;padding:14px;margin:6px 0;
  border:1px solid #ccc;border-radius:10px;font-size:16px;">

<input id="orderThana"
  placeholder="থানা/উপজেলা লিখুন"
  style="width:100%;padding:14px;margin:6px 0;
  border:1px solid #ccc;border-radius:10px;font-size:16px;">

<input id="orderUnion"
  placeholder="স্থান/ইউনিয়ন লিখুন"
  style="width:100%;padding:14px;margin:6px 0;
  border:1px solid #ccc;border-radius:10px;font-size:16px;">

<input id="orderVillage"
  placeholder="গ্রাম লিখুন"
  style="width:100%;padding:14px;margin:6px 0;
  border:1px solid #ccc;border-radius:10px;font-size:16px;">

        <button id="confirmOrder" style="
          width:100%;
          border:none;
          background:#087f3f;
          color:white;
          padding:15px;
          border-radius:12px;
          font-size:18px;
          font-weight:bold;
          margin-top:10px;
        ">
          📲 অর্ডার নিশ্চিত করুন
        </button>

      </div>
    </div>
  `;

  document.body.appendChild(modal);

  document.getElementById("closeOrder").onclick = function() {
    modal.remove();
  };

  document.getElementById("confirmOrder").onclick = function() {
    const customerName =
      document.getElementById("orderName").value.trim();

    const phone =
      document.getElementById("orderPhone").value.trim();

    const quantity =
      Number(document.getElementById("orderQuantity").value);

    const district =
  document.getElementById("orderDistrict").value.trim();

const thana =
  document.getElementById("orderThana").value.trim();

const union =
  document.getElementById("orderUnion").value.trim();

const village =
  document.getElementById("orderVillage").value.trim();

const address =
  "জেলা: " + district +
  ", থানা/উপজেলা: " + thana +
  ", স্থান/ইউনিয়ন: " + union +
  ", গ্রাম: " + village;
    if (!customerName || !phone || !district || !thana || !union || !village) {
  alert("নাম, মোবাইল নম্বর, জেলা, থানা/উপজেলা, স্থান/ইউনিয়ন ও গ্রাম পূরণ করুন");
  return;
}

    if (!Number.isInteger(quantity) || quantity <= 0) {
      alert("সঠিক পরিমাণ লিখুন।");
      return;
    }

    const productTotal = productPrice * quantity;
    const total = productTotal + DELIVERY_CHARGE;

    const message =
      "শপিং স্মার্ট দর্শনা\n" +
      "━━━━━━━━━━━━━━━━\n" +
      "নতুন অর্ডার\n\n" +
      "পণ্যের নাম: " + product.name + "\n" +
      "একক মূল্য: ৳" + productPrice + "\n" +
      "পরিমাণ: " + quantity + "\n" +
      "পণ্যের মোট মূল্য: ৳" + productTotal + "\n" +
      "ডেলিভারি চার্জ: ৳" + DELIVERY_CHARGE + "\n" +
      "━━━━━━━━━━━━━━━━\n" +
      "সর্বমোট: ৳" + total + "\n\n" +
      "কাস্টমারের নাম: " + customerName + "\n" +
      "মোবাইল নম্বর: " + phone + "\n" +
      "জেলা: " + district + "\n" +
"থানা/উপজেলা: " + thana + "\n" +
"স্থান/ইউনিয়ন: " + union + "\n" +
"গ্রাম: " + village + "\n\n" +
      "প্রোডাক্টের ছবি: " + imageUrl + "\n\n" +
"সবুজ Send (➤) বাটনে চাপ দিয়ে মেসেজটা পাঠিয়ে দিন। ❤️";

    const whatsappURL =
      "https://wa.me/" +
      WHATSAPP_NUMBER +
      "?text=" +
      encodeURIComponent(message);

    window.open(whatsappURL, "_blank");
  };
}

    function loadCategoryFromURL() {
      const params =
        new URLSearchParams(window.location.search);

      const category = params.get("category");

      if (
        ["fashion", "electronics", "home", "beauty"]
        .includes(category)
      ) {
        selectedCategory = category;

        document
          .querySelectorAll("#categoryButtons button")
          .forEach(function(btn) {
            btn.classList.remove("active");
          });

        const buttons =
          document.querySelectorAll("#categoryButtons button");

        const index = {
          fashion: 1,
          electronics: 2,
          home: 3,
          beauty: 4
        }[category];

        if (buttons[index]) {
          buttons[index].classList.add("active");
        }
      }

      renderProducts();
    }

    document.addEventListener(
      "DOMContentLoaded",
      loadCategoryFromURL
    );
  </script>

</body>
</html>
